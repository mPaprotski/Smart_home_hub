# Development simulation only. Never use as production deployment.
services:
  hub:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.dev
    environment:
      GOMEMLIMIT: 96MiB
      HUB_PROFILE: development
      HUB_ADAPTER_MODE: simulation
      HUB_STORAGE: memory_fake
      HUB_SERVER_HOST: 0.0.0.0
      HUB_CONTAINER_NETWORK: 'true'
    ports:
      - '127.0.0.1:${HUB_DEV_PORT:-8080}:8080'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 1.0
    stop_grace_period: 10s
    restart: 'no'
